<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - crust</title>
    <link rel="icon" type="image/avif" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=optional"></noscript>
    <link rel="stylesheet" href="../assets/css/style.bundle.min.css?v=20">
    <!-- Component Loader -->
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/loader.min.js?v=20"></script>

<style id="inline-loader-css">
.page-loader {
  position: fixed;
  inset: 0;
  background: var(--clr-background, #fdfbf7);
  z-index: 999999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  transition: opacity 0.45s ease, visibility 0.45s ease;
  opacity: 1;
  visibility: visible;
}
.page-loader.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.loader-logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.loader-logo.visible {
  opacity: 1;
  transform: scale(1);
}
.loader-bar-track {
  width: 150px;
  height: 4px;
  background: rgba(0, 0, 0, 0.05);
  border-radius: 4px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--clr-primary, #fb6815);
  border-radius: 4px;
  animation: loader-fill 2s ease-in-out infinite;
}
@keyframes loader-fill {
  0% { width: 0%; transform: translateX(-100%); }
  50% { width: 100%; transform: translateX(0); }
  100% { width: 0%; transform: translateX(100%); }
}
.page-loader.complete .loader-bar-fill {
  animation: none;
  width: 100%;
  transition: width 0.2s ease;
}
html.dark-mode .page-loader {
  background: #121212 !important;
}
html.dark-mode .loader-bar-track {
  background: rgba(255, 255, 255, 0.1);
}
.loader-spinner { display: none; }
.page-loader.spinner-mode { gap: 0; }
.page-loader.spinner-mode .loader-bar-track,
.page-loader.spinner-mode .loader-logo { display: none; }
.page-loader.spinner-mode .loader-spinner {
  display: block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(139, 69, 184, 0.2);
  border-top-color: var(--clr-primary, #fb6815);
  border-radius: 50%;
  animation: loader-spin 0.8s linear infinite;
}
@keyframes loader-spin {
  to { transform: rotate(360deg); }
}
</style>

</head>
<body>
<div id="page-loader" class="page-loader">
  <img class="loader-logo" id="loader-logo-img" src="../assets/images/logo.avif" alt="crust" width="80" height="80" fetchpriority="high" decoding="sync"/>
  <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
  <div class="loader-spinner"></div>
</div>

    <main>
        <section class="profile-page" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="profile-stacked-wrapper" style="max-width: 900px; margin: 0 auto;">
                    
                    <div class="profile-header" style="background: white; border-radius: 16px; padding: 2.5rem 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 2rem;">
                        <div style="width: 90px; height: 90px; background: var(--clr-primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 0 auto 1.5rem;">M</div>
                        <h3 style="margin-bottom: 0.5rem; font-size: 1.3rem;">Maria Silva</h3>
                        <p style="color: var(--clr-text-secondary, #666); font-size: 0.95rem;">maria.silva@email.com</p>
                    </div>

                    <div class="profile-nav-buttons">
                        <a href="profile.html" class="profile-btn">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </span>
                            <span class="btn-text">My Details</span>
                        </a>
                        <a href="orders.html" class="profile-btn">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                            </span>
                            <span class="btn-text">My Orders</span>
                        </a>
                        <a href="address.html" class="profile-btn active">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </span>
                            <span class="btn-text">Address</span>
                        </a>
                        <a href="#" class="profile-btn danger">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            </span>
                            <span class="btn-text">Logout</span>
                        </a>
                    </div>
                    
                    <div class="profile-content" style="background: white; border-radius: 16px; padding: 3.5rem;">
    <div class="section-header" style="text-align: left; margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="font-size: 2rem;">My Addresses</h2>
            <p style="color: var(--clr-text-secondary, #666);">Manage your delivery addresses.</p>
        </div>
        <button id="add-address-btn" class="btn btn-primary" style="border-radius: 50px; padding: 0.8rem 1.5rem;">+ Add New</button>
    </div>
    
    <div id="address-list-container">
        <!-- Rendered by JS -->
    </div>

    <!-- Address Modal/Form -->
    <div id="address-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px;">
            <h3 id="address-modal-title" style="margin-bottom: 1.5rem;">Add Address</h3>
            <form id="address-form">
                <input type="hidden" id="addr-id">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Address Title (e.g., Home, Work)</label>
                    <input type="text" id="addr-title" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Street Address</label>
                    <input type="text" id="addr-street" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">City</label>
                        <input type="text" id="addr-city" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Zip Code</label>
                        <input type="text" id="addr-zip" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" id="cancel-addr-btn" class="btn" style="flex: 1; background: #eee; color: var(--clr-text-primary, #333);">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

                </div>
            </div>
        </section>
    </main>
    <script defer src="../assets/js/menu-data.js"></script>
    <script defer src="../assets/js/search.js?v=2"></script>
<script defer src="../assets/js/script.bundle.min.js?v=20"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('address-list-container');
            const addBtn = document.getElementById('add-address-btn');
            const modal = document.getElementById('address-modal');
            const form = document.getElementById('address-form');
            const cancelBtn = document.getElementById('cancel-addr-btn');
            
            let addresses = JSON.parse(localStorage.getItem('hdm_addresses')) || [
                { id: 1, title: 'Home', street: 'House 45, Street 1, DC Colony', city: 'Gujranwala', zip: '01310-100', isDefault: true }
            ];

            function saveAddresses() {
                localStorage.setItem('hdm_addresses', JSON.stringify(addresses));
            }

            function renderAddresses() {
                if (addresses.length === 0) {
                    listContainer.innerHTML = `
                        <div style="text-align: center; padding: 3rem; background: #f9f9f9; border-radius: 12px; border: 1px dashed #ccc;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" style="width: 48px; height: 48px; margin-bottom: 1rem;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <h3 style="color: var(--clr-text-secondary, #666); margin-bottom: 0.5rem;">No addresses found</h3>
                            <p style="color: #999;">Add a new delivery address to get started.</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = addresses.map(addr => `
                    <div style="border: 2px solid ${addr.isDefault ? 'var(--clr-primary)' : '#eee'}; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-start; background: ${addr.isDefault ? '#fffbf8' : '#fff'}; transition: all 0.3s ease;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                                <h4 style="font-size: 1.1rem; color: var(--clr-text-primary); margin: 0;">${addr.title}</h4>
                                ${addr.isDefault ? '<span style="background: var(--clr-primary); color: white; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 50px; font-weight: 600;">Default</span>' : ''}
                            </div>
                            <p style="color: var(--clr-text-secondary, #666); margin: 0 0 0.2rem 0;">${addr.street}</p>
                            <p style="color: var(--clr-text-secondary, #666); margin: 0;">${addr.city}, ${addr.zip}</p>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            ${!addr.isDefault ? `<button onclick="setDefaultAddress(${addr.id})" class="btn" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: #eee; color: var(--clr-text-primary, #333);">Set Default</button>` : ''}
                            <button onclick="editAddress(${addr.id})" class="btn" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: #e3f2fd; color: #1976d2;">Edit</button>
                            <button onclick="deleteAddress(${addr.id})" class="btn" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: #ffebee; color: #d32f2f;">Delete</button>
                        </div>
                    </div>
                `).join('');
            }

            window.setDefaultAddress = (id) => {
                addresses.forEach(a => a.isDefault = a.id === id);
                saveAddresses();
                renderAddresses();
            };

            window.deleteAddress = (id) => {
                if (confirm('Are you sure you want to delete this address?')) {
                    addresses = addresses.filter(a => a.id !== id);
                    if (addresses.length > 0 && !addresses.some(a => a.isDefault)) {
                        addresses[0].isDefault = true;
                    }
                    saveAddresses();
                    renderAddresses();
                }
            };

            window.editAddress = (id) => {
                const addr = addresses.find(a => a.id === id);
                if (addr) {
                    document.getElementById('addr-id').value = addr.id;
                    document.getElementById('addr-title').value = addr.title;
                    document.getElementById('addr-street').value = addr.street;
                    document.getElementById('addr-city').value = addr.city;
                    document.getElementById('addr-zip').value = addr.zip;
                    document.getElementById('address-modal-title').textContent = 'Edit Address';
                    modal.style.display = 'flex';
                }
            };

            addBtn.addEventListener('click', () => {
                form.reset();
                document.getElementById('addr-id').value = '';
                document.getElementById('address-modal-title').textContent = 'Add Address';
                modal.style.display = 'flex';
            });

            cancelBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('addr-id').value;
                const newAddr = {
                    title: document.getElementById('addr-title').value,
                    street: document.getElementById('addr-street').value,
                    city: document.getElementById('addr-city').value,
                    zip: document.getElementById('addr-zip').value
                };

                if (id) {
                    const index = addresses.findIndex(a => a.id == id);
                    if (index !== -1) {
                        addresses[index] = { ...addresses[index], ...newAddr };
                    }
                } else {
                    newAddr.id = Date.now();
                    newAddr.isDefault = addresses.length === 0;
                    addresses.push(newAddr);
                }

                saveAddresses();
                renderAddresses();
                modal.style.display = 'none';
            });

            renderAddresses();
        });
    </script>
</body>
</html>
