<style id="inline-loader-css">
.page-loader {
  position: fixed;
  inset: 0;
  background: var(--clr-background, #fdfbf7);
  z-index: 999999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  transition: opacity 0.45s ease, visibility 0.45s ease;
  opacity: 1;
  visibility: visible;
}
.page-loader.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.loader-logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.loader-logo.visible {
  opacity: 1;
  transform: scale(1);
}
.loader-bar-track {
  width: 150px;
  height: 4px;
  background: rgba(0, 0, 0, 0.05);
  border-radius: 4px;
  overflow: hidden;
}
.loader-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--clr-primary, #fb6815);
  border-radius: 4px;
  animation: loader-fill 2s ease-in-out infinite;
}
@keyframes loader-fill {
  0% { width: 0%; transform: translateX(-100%); }
  50% { width: 100%; transform: translateX(0); }
  100% { width: 0%; transform: translateX(100%); }
}
.page-loader.complete .loader-bar-fill {
  animation: none;
  width: 100%;
  transition: width 0.2s ease;
}
html.dark-mode .page-loader {
  background: #121212 !important;
}
html.dark-mode .loader-bar-track {
  background: rgba(255, 255, 255, 0.1);
}
.loader-spinner { display: none; }
.page-loader.spinner-mode { gap: 0; }
.page-loader.spinner-mode .loader-bar-track,
.page-loader.spinner-mode .loader-logo { display: none; }
.page-loader.spinner-mode .loader-spinner {
  display: block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(139, 69, 184, 0.2);
  border-top-color: var(--clr-primary, #fb6815);
  border-radius: 50%;
  animation: loader-spin 0.8s linear infinite;
}
@keyframes loader-spin {
  to { transform: rotate(360deg); }
}
</style>

                </div>

                <script>
                (function() {
                    try {
                        const defaults = [
                            { id: 'g1', url: '../assets/gallery/gallery-1.avif', name: 'Gallery Image 1' },
                            { id: 'g2', url: '../assets/gallery/gallery-2.avif', name: 'Gallery Image 2' },
                            { id: 'g3', url: '../assets/gallery/gallery-3.avif', name: 'Gallery Image 3' },
                            { id: 'g4', url: '../assets/gallery/gallery-4.avif', name: 'Gallery Image 4' },
                            { id: 'g5', url: '../assets/gallery/gallery-5.avif', name: 'Gallery Image 5' },
                            { id: 'g6', url: '../assets/gallery/gallery-6.avif', name: 'Gallery Image 6' },
                            { id: 'g7', url: '../assets/gallery/gallery-7.avif', name: 'Gallery Image 7' },
                            { id: 'g8', url: '../assets/gallery/gallery-8.avif', name: 'Gallery Image 8' },
                            { id: 'g9', url: '../assets/gallery/gallery-9.avif', name: 'Gallery Image 9' },
                            { id: 'g10', url: '../assets/gallery/gallery-10.avif', name: 'Gallery Image 10' },
                            { id: 'g11', url: '../assets/gallery/gallery-11.avif', name: 'Gallery Image 11' },
                            { id: 'g12', url: '../assets/gallery/gallery-12.avif', name: 'Gallery Image 12' }
                        ];

                        let items = defaults;
                        const stored = localStorage.getItem('crust_gallery');
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                items = parsed;
                                // Automatically inject new defaults that are missing from old browser cache
                                defaults.forEach(def => {
                                    if (!items.find(p => p.id === def.id)) {
                                        items.push(def);
                                    }
                                });
                                // Update storage silently so it stays synced
                                localStorage.setItem('crust_gallery', JSON.stringify(items));
                            }
                        }

                        const grid = document.getElementById('gallery-grid');
                        if (!grid) return;
                        grid.innerHTML = items.map(function(img) {
                            return '<div class="gallery-item"><img loading="lazy" decoding="async" src="' + img.url + '" alt="' + (img.name || 'Gallery Image') + '" class="lightbox-trigger" width="300" height="300"></div>';
                        }).join('');
                    } catch(e) { /* silently fall back to static images */ }
                })();
                </script>
