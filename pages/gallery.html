<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - crust</title>
    <link rel="icon" type="image/avif" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"></noscript>
    <link rel="stylesheet" href="../assets/css/style.bundle.css?v=20">
    <!-- Component Loader -->
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/loader.js?v=20"></script>
</head>
<body>
<div id="page-loader" class="page-loader">
  <img class="loader-logo" id="loader-logo-img" src="../assets/images/logo.avif" alt="crust" width="80" height="80" fetchpriority="high" decoding="sync"/>
  <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
  <div class="loader-spinner"></div>
</div>

    <main>
        <section class="gallery-section" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="section-header" style="margin-bottom: 2.5rem;">
                    <h2>Our Gallery</h2>
                    <p style="color: var(--clr-text-secondary, #666); font-size: 1.05rem;">Discover our space and see our most ordered dishes.</p>
                </div>
                
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Populated dynamically; static fallback below if no dashboard data -->
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-1.avif" alt="Gallery Image 1" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-2.avif" alt="Gallery Image 2" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-3.avif" alt="Gallery Image 3" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-4.avif" alt="Gallery Image 4" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-5.avif" alt="Gallery Image 5" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-6.avif" alt="Gallery Image 6" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-7.avif" alt="Gallery Image 7" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-8.avif" alt="Gallery Image 8" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-9.avif" alt="Gallery Image 9" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-10.avif" alt="Gallery Image 10" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-11.avif" alt="Gallery Image 11" class="lightbox-trigger" width="300" height="300"></div>
                    <div class="gallery-item"><img loading="lazy" decoding="async" src="../assets/gallery/gallery-12.avif" alt="Gallery Image 12" class="lightbox-trigger" width="300" height="300"></div>
                </div>

                <script>
                (function() {
                    try {
                        const stored = localStorage.getItem('crust_gallery');
                        if (!stored) return;
                        const items = JSON.parse(stored);
                        if (!Array.isArray(items) || items.length === 0) return;
                        const grid = document.getElementById('gallery-grid');
                        if (!grid) return;
                        grid.innerHTML = items.map(function(img) {
                            return '<div class="gallery-item"><img loading="lazy" decoding="async" src="' + img.url + '" alt="' + (img.name || 'Gallery Image') + '" class="lightbox-trigger" width="300" height="300"></div>';
                        }).join('');
                    } catch(e) { /* silently fall back to static images */ }
                })();
                </script>


                <div style="text-align: center; margin-top: 2.5rem; padding: 3rem 2rem; background: rgba(211, 47, 47, 0.05); border-radius: var(--border-radius-lg); border: 1px dashed rgba(211, 47, 47, 0.3);">
                    <h3 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--clr-text-primary);">More Moments</h3>
                    <p style="color: var(--clr-text-secondary, #666); font-size: 1.1rem; margin-bottom: 2rem;">Follow our day to day on Instagram!</p>
                    <a href="https://www.instagram.com/crust/" target="_blank" class="btn btn-primary" style="background: var(--clr-primary); background-image: none; border-radius: 50px; font-weight: 600; padding: 0.8rem 1.5rem; box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3); font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; white-space: nowrap; max-width: 100%;">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        Follow on Insta
                    </a>
                </div>
            </section>
    </main>
    <script defer src="../assets/js/menu-data.js"></script>
    <script defer src="../assets/js/search.js?v=2"></script>
<script defer src="../assets/js/script.bundle.js?v=20"></script>

</body>
</html>
