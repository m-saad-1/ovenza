<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - crust</title>
    <link rel="icon" type="image/avif" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"></noscript>
    <link rel="stylesheet" href="../assets/css/style.bundle.css?v=16">
    <!-- Component Loader -->
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/loader.js?v=11"></script>
</head>
<body>
<div id="page-loader" class="page-loader">
  <img class="loader-logo" id="loader-logo-img" src="../assets/images/logo.avif" alt="crust" width="80" height="80" fetchpriority="high" decoding="sync"/>
  <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
  <div class="loader-spinner"></div>
</div>

    <main>
        <section class="cart-page" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
                    <h2 style="font-size: 2rem;">My Cart</h2>
                </div>
                
                <!-- Desktop uses grid, mobile wraps to column -->
                <div class="cart-grid-wrapper">
                    
                    <!-- Empty Cart State (Hidden by default) -->
                    <div class="empty-cart-state" style="display: none; flex: 1 1 100%; text-align: center; padding: 4rem 2rem; background: var(--clr-surface); border-radius: 16px; box-shadow: var(--card-shadow);">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1.5rem;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <h3 style="font-size: 1.5rem; color: var(--clr-text-primary); margin-bottom: 0.5rem;">Your cart is empty</h3>
                        <p style="color: var(--clr-text-secondary, #666); margin-bottom: 2rem;">It looks like you haven\'t added any delicious items to your order yet.</p>
                        <a href="menu.html" class="btn btn-primary" style="padding: 0.8rem 2rem; border-radius: 50px; text-decoration: none;">Explore Menu</a>
                    </div>

                    <!-- Cart Items -->
                    <div class="cart-items-wrapper">
                        <div class="cart-item">
                            <img loading="lazy" decoding="async" src="../assets/images/combo-1.avif" class="cart-item-img lightbox-trigger" alt="Combo 1" width="228" height="228">
                            <div class="cart-item-details">
                                <h4 class="cart-item-title">Combo 1</h4>
                                <span class="cart-item-price">Rs 459</span>
                            </div>
                            <div class="cart-item-actions">
                                <div class="quantity-stepper">
                                    <button class="stepper-btn">-</button>
                                    <span class="stepper-value">1</span>
                                    <button class="stepper-btn">+</button>
                                </div>
                                <button class="cart-remove-btn" aria-label="Remover">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="cart-item">
                            <img loading="lazy" decoding="async" src="../assets/images/combo-3.avif" class="cart-item-img lightbox-trigger" alt="Combo 3" width="228" height="228">
                            <div class="cart-item-details">
                                <h4 class="cart-item-title">Combo 3</h4>
                                <span class="cart-item-price">Rs 1299</span>
                            </div>
                            <div class="cart-item-actions">
                                <div class="quantity-stepper">
                                    <button class="stepper-btn">-</button>
                                    <span class="stepper-value">1</span>
                                    <button class="stepper-btn">+</button>
                                </div>
                                <button class="cart-remove-btn" aria-label="Remover">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Order Summary Only -->
                    <div class="checkout-summary-box" style="display: flex; flex-direction: column; gap: 2rem;">
                        <style>
                            html.dark-mode .checkout-summary-box span { color: #fff !important; }
                        </style>
                        <div>
                            <h3 style="margin-bottom: 1.5rem; color: var(--clr-text-primary); font-size: 1.4rem;">Order Summary</h3>
                            
                            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--clr-text-secondary, #555); font-size: 1.05rem;">
                                <span>Subtotal</span>
                                <span class="subtotal-val" style="font-weight: 600;">Rs 0</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; color: var(--clr-text-secondary, #555); font-size: 1.05rem; border-bottom: 1px solid #eee; padding-bottom: 1.5rem;">
                                <span>Delivery Fee</span>
                                <span style="font-weight: 600;">Rs 12</span>
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem; font-size: 1.4rem; font-weight: 700;">
                                <span>Total</span>
                                <span class="total-val" style="color: var(--clr-primary);">Rs 0</span>
                            </div>
                            
                            <a href="checkout.html" class="btn btn-primary" style="width: 100%; border-radius: 50px; padding: 1.2rem; font-size: 1.1rem; display: block; text-align: center; text-decoration: none;">Proceed to Checkout</a>
                            <a href="menu.html" style="display: block; text-align: center; margin-top: 1rem; color: var(--clr-text-secondary, #666); font-weight: 600; text-decoration: none; font-size: 0.95rem;">Continue Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script defer src="../assets/js/menu-data.js"></script>
    <script defer src="../assets/js/search.js?v=2"></script>
<script defer src="../assets/js/script.bundle.js"></script>

</body>
</html>
