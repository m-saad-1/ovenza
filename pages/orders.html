<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">

<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - crust</title>
    <link rel="icon" type="image/avif" href="../assets/images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"></noscript>
    <link rel="stylesheet" href="../assets/css/style.bundle.css?v=16">
    <!-- Component Loader -->
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/loader.js?v=11"></script>
    <style>
        .order-timeline {
            display: flex; justify-content: space-between; position: relative; margin: 1.5rem 0; padding: 0;
        }
        /* Track wrapper to align exactly with centers of first and last 28px icons */
        .timeline-track {
            position: absolute; top: 12px; left: 14px; right: 14px; height: 4px; background: #eee; z-index: 0; border-radius: 2px;
        }
        html.dark-mode .timeline-track { background: rgba(255,255,255,0.15); }
        
        .timeline-progress {
            position: absolute; top: 0; left: 0; bottom: 0; background: var(--clr-primary); border-radius: 2px; transition: width 0.8s ease;
        }

        .timeline-step {
            position: relative; z-index: 1; text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        }
        .timeline-step .step-icon {
            width: 28px; height: 28px; border-radius: 50%; background: #eee; border: 4px solid #fff; transition: all 0.5s ease;
        }
        html.dark-mode .timeline-step .step-icon { background: rgba(255,255,255,0.2); border-color: var(--clr-surface, #1e1e1e); }

        .timeline-step span {
            font-size: 0.75rem; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .timeline-step.completed .step-icon {
            background: var(--clr-primary);
        }
        html.dark-mode .timeline-step.completed .step-icon {
            border-color: var(--clr-surface, #1e1e1e);
            background: var(--clr-primary) !important;
            opacity: 1;
        }
        
        .timeline-step.completed span {
            color: var(--clr-primary);
        }

        .timeline-step.pulsing .step-icon {
            background: var(--clr-primary);
            animation: pulse-ring 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        html.dark-mode .timeline-step.pulsing .step-icon {
            background: var(--clr-primary) !important;
        }
        .timeline-step.pulsing span {
            color: var(--clr-text-primary);
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(167, 2, 1, 0.6); }
            100% { box-shadow: 0 0 0 12px rgba(167, 2, 1, 0); }
        }
        
        @media(max-width: 600px) {
            .timeline-step span { font-size: 0.55rem !important; letter-spacing: 0; }
            .timeline-step .step-icon { width: 22px; height: 22px; border-width: 3px; }
            /* Center of 22px icon is 11px. Bar height is 4px -> top: 9px. Left/right: 11px */
            .timeline-track { top: 9px; left: 11px; right: 11px; }
        }
    </style>
</head>
<body>
<div id="page-loader" class="page-loader">
  <img class="loader-logo" id="loader-logo-img" src="../assets/images/logo.avif" alt="crust" width="80" height="80" fetchpriority="high" decoding="sync"/>
  <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
  <div class="loader-spinner"></div>
</div>

    <main>
        <section class="orders-page" style="padding: 2.5rem 0; background-color: var(--clr-background); min-height: 70vh;">
            <div class="container">
                <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
                    <h2>My Orders</h2>
                </div>
                
                <div style="max-width: 800px; margin: 0 auto;">
                    
                    <!-- Empty State (Hidden by default) -->
                    <div class="empty-orders-state" style="display: none; text-align: center; padding: 4rem 2rem; background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1.5rem;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h3 style="font-size: 1.5rem; color: var(--clr-text-primary); margin-bottom: 0.5rem;">No orders found</h3>
                        <p style="color: var(--clr-text-secondary, #666); margin-bottom: 2rem;">You haven't placed any orders yet.</p>
                        <a href="menu.html" class="btn btn-primary" style="padding: 0.8rem 2rem; border-radius: 50px; text-decoration: none;">Place an Order</a>
                    </div>

                    <!-- Demo Order -->
                    <div class="dynamic-orders-wrapper">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script defer src="../assets/js/search.js?v=2"></script>
<script defer src="../assets/js/script.bundle.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const STAGES = ["Pending", "Confirmed", "Preparing", "Out for Delivery", "Delivered"];
        const STAGE_DELAY_MS = 6000; // 6 seconds per stage for demo
        
        function renderOrders() {
            const wrapper = document.querySelector('.dynamic-orders-wrapper');
            const emptyState = document.querySelector('.empty-orders-state');
            
            let orders = JSON.parse(localStorage.getItem("hdm_orders")) || [];
            
            // Seeded demo order removed per requirements. Newly placed demo orders will still work.
            
            if (orders.length === 0) {
                wrapper.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            wrapper.style.display = 'block';
            emptyState.style.display = 'none';
            
            let html = '';
            let needsUpdate = false;
            
            orders.forEach(order => {
                let currentStatusIndex = STAGES.indexOf(order.status);
                if (currentStatusIndex === -1) currentStatusIndex = 0;
                
                let now = Date.now();
                if (!order.lastUpdated) order.lastUpdated = now;
                
                // Auto progression logic
                if (currentStatusIndex < STAGES.length - 1) {
                    let timeElapsed = now - order.lastUpdated;
                    let stagesToAdvance = Math.floor(timeElapsed / STAGE_DELAY_MS);
                    
                    if (stagesToAdvance > 0) {
                        currentStatusIndex = Math.min(STAGES.length - 1, currentStatusIndex + stagesToAdvance);
                        order.status = STAGES[currentStatusIndex];
                        order.lastUpdated = now - (timeElapsed % STAGE_DELAY_MS);
                        needsUpdate = true;
                    }
                }
                
                let progressPercent = (currentStatusIndex / (STAGES.length - 1)) * 100;
                
                // Render items
                let itemsHtml = '';
                if(order.items && order.items.length > 0) {
                    itemsHtml = order.items.map(item => `
                        <div style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.6rem;">
                            ${item.image ? `<img loading="lazy" decoding="async" src="${item.image}" alt="${item.title}" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0;">` : ''}
                            <div style="flex: 1;">
                                <p style="font-weight: 600; font-size: 0.9rem; margin: 0 0 0.1rem; color: var(--clr-text-primary);">${item.title} x ${item.qty}</p>
                                ${item.desc ? `<p style="font-size: 0.8rem; color: #888; margin: 0;">${item.desc}</p>` : ''}
                            </div>
                            <span style="font-weight: 700; font-size: 0.9rem; color: var(--clr-text-primary); white-space: nowrap;">Rs ${(item.price || item.basePrice || 0) * item.qty}</span>
                        </div>
                    `).join('');
                }

                html += `
                <div class="order-card" style="background: var(--clr-surface, #fff); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 1.5rem; border: 1px solid rgba(0,0,0,0.05);">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                        <div>
                            <p style="font-size: 0.8rem; color: #999; margin: 0 0 0.2rem;">Order #${order.id || 'ORD-'+Math.floor(Math.random()*1000)}</p>
                            <p style="font-size: 0.85rem; color: var(--clr-text-secondary, #666); margin: 0;">${order.date}</p>
                            ${order.status !== 'Delivered' ? `<p style="font-size: 0.85rem; color: var(--clr-primary); font-weight: 600; margin: 0.3rem 0 0 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; margin-top:-2px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Est. Delivery: ~35 mins</p>` : `<p style="font-size: 0.85rem; color: #2e7d32; font-weight: 600; margin: 0.3rem 0 0 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; margin-top:-2px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>Delivered Successfully</p>`}
                        </div>
                        <span style="background: ${order.status === 'Delivered' ? '#e8f5e9' : 'rgba(167, 2, 1, 0.1)'}; color: ${order.status === 'Delivered' ? '#2e7d32' : 'var(--clr-primary)'}; font-size: 0.78rem; font-weight: 700; padding: 0.3rem 0.8rem; border-radius: 50px; text-transform: uppercase;">${order.status}</span>
                    </div>
                    
                    <div class="order-timeline">
                        <div class="timeline-track">
                            <div class="timeline-progress" style="width: ${progressPercent}%;"></div>
                        </div>
                        ${STAGES.map((stage, idx) => {
                            let classes = "timeline-step";
                            if (idx < currentStatusIndex) classes += " completed";
                            else if (idx === currentStatusIndex && stage !== 'Delivered') classes += " pulsing completed";
                            else if (idx === currentStatusIndex && stage === 'Delivered') classes += " completed";
                            return `<div class="${classes}"><div class="step-icon"></div><span class="desktop-hide-text">${stage}</span></div>`;
                        }).join('')}
                    </div>
                    
                    <div style="border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1rem; margin-bottom: 1rem; margin-top: 1.5rem;">
                        ${itemsHtml}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 1rem;">
                        <span style="font-size: 0.9rem; color: var(--clr-text-primary);">Total</span>
                        <span style="font-size: 1.1rem; font-weight: 700; color: var(--clr-text-primary);">Rs ${order.total}</span>
                    </div>
                    <div style="margin-top: 1rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
                        <a href="menu.html" class="btn btn-primary" style="border-radius: 50px; padding: 0.6rem 1.25rem; font-size: 0.85rem; font-weight: 600; text-decoration: none;">Reorder</a>
                    </div>
                </div>
                `;
            });
            
            // Only rewrite DOM if content changed (prevents re-render flickering)
            if (wrapper.innerHTML !== html) {
                wrapper.innerHTML = html;
            }
            
            if (needsUpdate) {
                localStorage.setItem("hdm_orders", JSON.stringify(orders));
            }
        }
        
        renderOrders();
        setInterval(renderOrders, 1000); // Check every second for demo progression
    });
</script>
</body>
</html>
